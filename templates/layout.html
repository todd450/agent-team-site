<!doctype html>
<html lang="en">
<head>
<!-- Generated by `npm run build` (scripts/generate.js) out of templates/,
     content/copy/en/ and content/facts.json. Never edited by hand: check.sh
     fails when this file is not what a fresh build writes (issue #28). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{site.title}}</title>
<!-- modern-normalize first, tokens.css last: the reset is only a floor the
     page stands on, and every colour, font and spacing above it comes from a
     token (issue #26). The reset is a file in this repo, so the page asks
     nobody else for bytes when it loads. Both are addressed from the page's
     own URL, because a page served from a directory of its own (/record/) is
     not served from the site's root: a bare "tokens.css" on it would ask the
     site for record/tokens.css, which is not there (issue #29). -->
<link rel="stylesheet" href="{{page.toRoot}}modern-normalize.css">
<link rel="stylesheet" href="{{page.toRoot}}tokens.css">
<style>
  /* No box-sizing, -webkit-text-size-adjust or body margin reset here:
     modern-normalize above covers all three. */
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-text);
    font-size:17px;
    line-height:1.62;
  }

  .shell{max-width:62em; margin:0 auto; padding:0 var(--s5) var(--s8)}
  .col{max-width:var(--measure)}

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 var(--s3);
  }
  h1{font-size:30px; line-height:1.2; letter-spacing:-.015em; font-weight:600; margin:0 0 var(--s4)}
  h2{
    font-size:13px;
    font-family:var(--font-mono);
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 var(--s5);
    padding-bottom:var(--s2);
    border-bottom:1px solid var(--rule-strong);
  }
  p{margin:0 0 var(--s4)}
  .lede{font-size:19px; color:var(--ink-muted)}
  a{color:var(--ink); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px}
  a:hover{text-decoration-color:var(--green)}
  .num{font-family:var(--font-mono)}

  header.masthead{padding:var(--s7) 0 var(--s6)}
  section{padding:var(--s7) 0; border-top:1px solid var(--rule)}
  footer{padding:var(--s5) 0 0; border-top:1px solid var(--rule); font-size:14px; color:var(--ink-muted)}

  /* --- status band (issue #5) ---------------------------------------- */
  .band{border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); padding:0}
  .band-head{
    display:flex;
    flex-wrap:wrap;
    gap:var(--s2) var(--s4);
    align-items:baseline;
    justify-content:space-between;
    padding:var(--s4) 0;
    border-bottom:1px solid var(--rule);
  }
  .verdict{
    font-family:var(--font-mono);
    font-size:13px;
    letter-spacing:.02em;
    font-weight:600;
    display:flex;
    align-items:flex-start;
    gap:var(--s2);
  }
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:0 0 auto}
  /* stylelint-disable-next-line scale-unlimited/declaration-strict-value -- an optical
     nudge, not spacing: it drops the 9px dot onto the cap height of the verdict line's
     first line, which is a fraction of that line's size and no --sN token expresses. */
  .verdict .dot{margin-top:.45em}
  .dot-green{background:var(--green)}
  .dot-red{background:var(--red)}
  .dot-open{background:transparent; border:2px solid var(--ochre)}
  .stamp{font-family:var(--font-mono); font-size:11px; letter-spacing:.02em; color:var(--ink-muted)}

  .steps{display:grid; gap:1px; background:var(--rule); margin:0; padding:0; list-style:none}
  .step{background:var(--paper); padding:var(--s4) 0 var(--s5)}
  .step-top{
    display:flex;
    align-items:center;
    gap:var(--s2);
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin-bottom:var(--s2);
  }
  .step-name{display:block; font-size:16px; font-weight:600; letter-spacing:-.01em; margin-bottom:var(--s2)}
  .step-state{font-family:var(--font-mono); font-size:12px; color:var(--green); font-weight:600}
  .step-state.running{color:var(--ochre)}
  .step-check{display:block; font-size:13px; line-height:1.5; color:var(--ink-muted); margin-top:var(--s2)}

  /* --- the four costs (issue #5) --------------------------------------- */
  .evidence{display:grid; gap:1px; background:var(--rule); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule)}
  .ev{background:var(--paper); padding:var(--s5) 0}
  .ev-figure{
    font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;
    font-size:34px;
    line-height:1;
    letter-spacing:-.03em;
    display:block;
    margin-bottom:var(--s2);
  }
  .ev-unit{font-size:13px; letter-spacing:0; color:var(--ink-muted); font-weight:400}
  .ev-claim{margin:0 0 var(--s2); font-size:16px; line-height:1.5}
  .ev-src{font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); letter-spacing:.02em}

  /* --- how a change flows (issue #6) ----------------------------------- */
  .rail{list-style:none; margin:0 0 var(--s5); padding:0; display:grid; gap:1px; background:var(--rule)}
  .rail li{background:var(--paper); padding:var(--s3) 0; display:flex; gap:var(--s3); align-items:baseline}
  .rail .who{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-muted);
    flex:0 0 7.5em;
  }
  .rail .does{font-size:15px; line-height:1.5}
  .rail .gate{color:var(--red); font-weight:600}
  .note{font-size:14px; line-height:1.55; color:var(--ink-muted)}

  /* --- what this is not (issue #6) -------------------------------------- */
  .limits-box{background:var(--paper-sunk); padding:var(--s5); border-left:2px solid var(--rule-strong)}
  .limits-box h3{font-size:17px; font-weight:600; margin:0 0 var(--s2); letter-spacing:-.01em}
  .limits-box p:last-child{margin-bottom:0}

  /* --- how we will know (issue #6) --------------------------------------- */
  table{width:100%; border-collapse:collapse; font-size:15px}
  caption{text-align:left; font-size:14px; color:var(--ink-muted); margin-bottom:var(--s3)}
  th,td{text-align:left; padding:var(--s3) var(--s3) var(--s3) 0; border-bottom:1px solid var(--rule); vertical-align:top}
  th{
    font-family:var(--font-mono);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-muted);
    font-weight:600;
    border-bottom:1px solid var(--rule-strong);
    white-space:nowrap;
  }
  td.figure{font-family:var(--font-mono); font-variant-numeric:tabular-nums; white-space:nowrap}
  .hit{color:var(--green); font-weight:600}
  .pending{color:var(--ochre); font-weight:600}

  /* The measures table becomes one block per measure below 860px: three
     columns of prose at 390px is unreadable, and the bar and today's figure
     matter more than their alignment. */
  @media (max-width:859px){
    table, caption, tbody, tr, td{display:block; width:auto}
    thead{display:none}
    tbody tr{padding:var(--s4) 0; border-bottom:1px solid var(--rule)}
    tbody tr:last-child{border-bottom:0}
    tbody td{border:0; padding:0}
    tbody td:first-child{font-weight:600; margin-bottom:var(--s2)}
    tbody td.figure{display:inline-block; margin-right:var(--s5); font-size:14px}
    tbody td.figure::before{
      content:attr(data-label);
      display:block;
      font-family:var(--font-mono);
      font-size:10px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--ink-muted);
    }
  }

  /* --- the record of this build (issue #6) ------------------------------- */
  .record-list{list-style:none; margin:0; padding:0}
  .record-list li{display:grid; gap:var(--s1); padding:var(--s4) 0; border-bottom:1px solid var(--rule)}
  .record-list li:last-child{border-bottom:0}
  .record-list .when{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }
  /* stylelint-disable-next-line no-descending-specificity -- .limits-box p:last-child
     above and .record-list p style paragraphs in different sections, so neither can
     ever win over the other and the source order between them does not matter. */
  .record-list p{margin:0; font-size:15px; line-height:1.55}

  @media (min-width:860px){
    body{font-size:18px}
    .shell{padding:0 var(--s7) var(--s9)}
    header.masthead{padding:var(--s9) 0 var(--s7)}
    h1{font-size:46px}
    .lede{font-size:21px}
    section{padding:var(--s8) 0}

    .band{display:grid; grid-template-columns:14em 1fr; align-items:start}
    /* The verdict line is the band's first column, so it gets the gutter and
       the 1px rule the step columns divide each other with -- without them it
       ends at the exact left edge of the STEP 1 column and the two run
       together. align-self:stretch runs that rule the full height of the
       steps beside it, like the dividers between them; justify-content goes
       back to flex-start because the phone layout's space-between would
       spread the verdict line and the stamp over that new height. */
    .band-head{
      grid-column:1;
      flex-direction:column;
      justify-content:flex-start;
      gap:var(--s5);
      border-bottom:0;
      border-right:1px solid var(--rule);
      padding:var(--s5) var(--s4) var(--s5) 0;
      align-self:stretch;
    }
    .steps{grid-column:2; grid-template-columns:repeat(4,1fr)}
    .step{padding:var(--s5) var(--s4)}

    .evidence{grid-template-columns:1fr 1fr}
    .ev{padding:var(--s5) var(--s5) var(--s5) 0}
    .ev:nth-child(even){padding-left:var(--s5); padding-right:0}
    .ev-figure{font-size:40px}

    .rail li{padding:var(--s3) var(--s4) var(--s3) 0}

    .limits-box, .record-list li, .rail, .flow .note{max-width:var(--measure)}
  }
</style>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{headline}}</h1>
    <p class="lede col">{{&lede}}</p>
  </header>

{{>page}}

  <footer>
    <p>{{&footer}}</p>
  </footer>

</div>
</body>
</html>
